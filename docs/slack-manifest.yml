# Paste this into https://api.slack.com/apps → Create New App → From a manifest. See docs/SLACK.md.
display_information:
  name: Bruh
  description: Remembers what your team decided, why, and who's on the hook. With receipts.
  background_color: "#1c1b1a"
features:
  bot_user:
    display_name: bruh
    always_online: true
  slash_commands:
    - command: /bruh
      description: Ask Bruh privately. Only you see the answer.
      usage_hint: what did we decide about pricing?
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read  # hear @bruh
      - channels:history   # read public channels Bruh is invited to
      - channels:read      # check a channel is public and not shared outside the company
      - chat:write         # answer
      - commands           # /bruh
      - reactions:read     # a 👍 counts as agreeing
      - users:read         # put names to messages
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - reaction_added
      - reaction_removed
      - member_joined_channel
      - channel_shared
      - channel_unshared
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
