[project]
name = "muninn"
version = "0.1.0"
description = "Organizational memory: turns team conversations into a cited record of decisions, reasons, commitments and open questions."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13",
    "fastapi>=0.115",
    "slack-bolt>=1.21",
    "uvicorn>=0.30",
]

[project.scripts]
muninn = "muninn.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muninn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
